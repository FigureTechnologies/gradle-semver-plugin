name: Gradle Build

on:
  pull_request:
    paths-ignore:
      - '**.md'

concurrency:
  group: gradle-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Published plugin resolves GITHUB_HEAD_REF as a real branch. Forked PRs only have the
      # merge/checkout commit, so materialize a local branch with that name before Gradle runs.
      - name: Materialize PR head branch for semver
        if: github.head_ref != ''
        run: git branch -f "$GITHUB_HEAD_REF" HEAD

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref_name != 'main' }}
          cache-cleanup: on-success
          gradle-home-cache-includes: |
            caches
            notifications
            jdks
            wrapper

      - name: Build
        run: ./gradlew build --parallel --build-cache --stacktrace

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: '**/build/test-results/**/*.xml'

      - name: Publish Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: '**/build/reports/tests/test/*'
